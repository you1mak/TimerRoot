
name: Build TimerRoot

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

      - name: Download Timer binary
        run: |
          mkdir -p app/src/main/assets
          git clone --depth 1 \
            https://github.com/YuKongA/CVE-2026-98260.git \
            /tmp/CVE-2026-98260

          test -f /tmp/CVE-2026-98260/timer/timer

          cp /tmp/CVE-2026-98260/timer/timer \
            app/src/main/assets/timer

      - name: Build Debug APK
        run: |
          gradle --no-daemon assembleDebug

      - name: Build Release APK
        run: |
          gradle --no-daemon assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TimerRoot-Debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: TimerRoot-Release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
